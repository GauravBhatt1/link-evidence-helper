name: Browser worker lockfile update

on:
  push:
    branches:
      - restructure/browser-worker-fallback
    paths:
      - apps/browser-worker/package.json
      - .github/workflows/browser-worker-lock.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restructure/browser-worker-fallback
      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.3"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Generate exact workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update browser worker lockfile"
          git push origin HEAD:restructure/browser-worker-fallback
