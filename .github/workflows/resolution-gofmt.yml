name: Resolution gofmt update

on:
  push:
    branches:
      - restructure/resolution-delivery-workflow
    paths:
      - "apps/worker/**/*.go"
      - ".github/workflows/resolution-gofmt.yml"

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restructure/resolution-delivery-workflow
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - name: Format worker Go files
        run: gofmt -w apps/worker
      - name: Commit exact gofmt output
        run: |
          if git diff --quiet -- apps/worker; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/worker
          git commit -m "style: apply gofmt to worker packages"
          git push origin HEAD:restructure/resolution-delivery-workflow
