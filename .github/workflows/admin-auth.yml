name: Admin authentication safety

on:
  pull_request:
    paths:
      - "apps/api/cmd/server/**"
      - "apps/api/internal/auth/**"
      - "apps/api/internal/adminauth/**"
      - "apps/api/internal/httpapi/**"
      - "docs/restructure/ADMIN_AUTH_RUNTIME.md"
      - ".github/workflows/admin-auth.yml"
  push:
    branches:
      - "restructure/integration"
    paths:
      - "apps/api/cmd/server/**"
      - "apps/api/internal/auth/**"
      - "apps/api/internal/adminauth/**"
      - "apps/api/internal/httpapi/**"
      - "docs/restructure/ADMIN_AUTH_RUNTIME.md"
      - ".github/workflows/admin-auth.yml"

permissions:
  contents: read

jobs:
  admin-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - name: Verify Go formatting
        run: |
          files="$(gofmt -l apps/api/cmd/server apps/api/internal/auth apps/api/internal/adminauth apps/api/internal/httpapi)"
          if test -n "$files"; then
            printf 'Go files require gofmt:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: Test authentication with race detector
        run: go test -race ./internal/auth ./internal/adminauth ./internal/httpapi
        working-directory: apps/api
      - name: Verify disabled-by-default runtime
        working-directory: apps/api
        run: |
          go build -o /tmp/link-evidence-api ./cmd/server
          env \
            LINK_EVIDENCE_SEARCH_MODE=fixture \
            LINK_EVIDENCE_LIBRARY_MODE=fixture \
            LINK_EVIDENCE_API_ADDR=127.0.0.1:8780 \
            LINK_EVIDENCE_FIXTURE_DIR="$GITHUB_WORKSPACE/packages/testing/fixtures" \
            /tmp/link-evidence-api >/tmp/link-evidence-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            status=$?
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8780/healthz >/dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null || test "$attempt" -eq 30; then
              cat /tmp/link-evidence-api.log
              exit 1
            fi
            sleep 1
          done
          status="$(curl --silent --output /tmp/admin.json --write-out '%{http_code}' http://127.0.0.1:8780/api/v1/admin/session)"
          test "$status" = "503"
          python3 -c 'import json; data=json.load(open("/tmp/admin.json")); assert data["code"] == "admin_auth_unavailable"'
