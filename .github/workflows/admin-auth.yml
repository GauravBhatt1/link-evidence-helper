name: Admin authentication boundary

on:
  pull_request:
    paths:
      - "apps/api/internal/auth/**"
      - ".github/workflows/admin-auth.yml"
  push:
    branches:
      - "restructure/integration"
    paths:
      - "apps/api/internal/auth/**"
      - ".github/workflows/admin-auth.yml"

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - name: Verify formatting
        run: |
          files="$(gofmt -l apps/api/internal/auth)"
          if test -n "$files"; then
            printf 'Go files require gofmt:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: Test authentication package
        run: go test -race ./internal/auth
        working-directory: apps/api
