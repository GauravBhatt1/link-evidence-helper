name: React shell checks

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "packages/testing/fixtures/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-shell.yml"
  push:
    branches:
      - "restructure/milestone-2-react-shell"
      - "restructure/milestone-3-react-search"
      - "restructure/integration"
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "packages/testing/fixtures/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/web-shell.yml"

permissions:
  contents: read

jobs:
  web-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.3"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "pnpm"
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @link-evidence/web typecheck
      - name: Test frontend components
        run: pnpm --filter @link-evidence/web test
      - name: Install Playwright Chromium
        run: pnpm --filter @link-evidence/web exec playwright install --with-deps chromium
      - name: Test frontend shell in Chromium
        run: pnpm --filter @link-evidence/web test:browser

  go-api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.3"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "pnpm"
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Go API
        run: go test ./...
        working-directory: apps/api
      - name: Install Playwright Chromium
        run: pnpm --filter @link-evidence/web exec playwright install --with-deps chromium
      - name: Start loopback-only fixture API
        run: |
          (cd apps/api && go build -o /tmp/link-evidence-api ./cmd/server)
          nohup env \
            LINK_EVIDENCE_SEARCH_MODE=fixture \
            LINK_EVIDENCE_API_ADDR=127.0.0.1:8780 \
            LINK_EVIDENCE_FIXTURE_DIR="$GITHUB_WORKSPACE/packages/testing/fixtures" \
            /tmp/link-evidence-api >/tmp/link-evidence-api.log 2>&1 &
          echo $! >/tmp/link-evidence-api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8780/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/link-evidence-api.log
          exit 1
      - name: Test React against Go API
        env:
          VITE_SEARCH_TRANSPORT: api
          VITE_SEARCH_API_TARGET: http://127.0.0.1:8780
        run: pnpm --filter @link-evidence/web exec playwright test e2e/api-search.spec.ts --project=mobile-390x844
      - name: Stop loopback-only fixture API
        if: always()
        run: |
          if test -f /tmp/link-evidence-api.pid; then
            kill "$(cat /tmp/link-evidence-api.pid)" 2>/dev/null || true
          fi
          test -z "$(ss -ltn 'sport = :8780' | tail -n +2)"
