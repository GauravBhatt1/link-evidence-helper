name: Temporary admin gofmt helper

on:
  push:
    branches:
      - restructure/admin-auth-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restructure/admin-auth-foundation
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - run: gofmt -w apps/api/cmd/server apps/api/internal/auth apps/api/internal/adminauth apps/api/internal/httpapi
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/cmd/server apps/api/internal/auth apps/api/internal/adminauth apps/api/internal/httpapi
          git commit -m "style: gofmt admin authentication"
          git push origin HEAD:restructure/admin-auth-foundation
