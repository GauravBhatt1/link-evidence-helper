name: Jellyfin connector safety

on:
  pull_request:
    paths:
      - "apps/api/cmd/server/**"
      - "apps/api/internal/library/**"
      - "docs/restructure/JELLYFIN_RUNTIME.md"
      - ".github/workflows/jellyfin.yml"
  push:
    branches:
      - "restructure/integration"
    paths:
      - "apps/api/cmd/server/**"
      - "apps/api/internal/library/**"
      - "docs/restructure/JELLYFIN_RUNTIME.md"
      - ".github/workflows/jellyfin.yml"

permissions:
  contents: read

jobs:
  jellyfin-connector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
      - name: Verify Go formatting
        run: |
          files="$(gofmt -l apps/api/cmd/server apps/api/internal/library)"
          if test -n "$files"; then
            printf 'Go files require gofmt:\n%s\n' "$files" >&2
            exit 1
          fi
      - name: Test connector with race detector
        run: go test -race ./...
        working-directory: apps/api
      - name: Verify fixture-default runtime boundary
        working-directory: apps/api
        run: |
          go build -o /tmp/link-evidence-api ./cmd/server
          env \
            LINK_EVIDENCE_SEARCH_MODE=fixture \
            LINK_EVIDENCE_LIBRARY_MODE=fixture \
            LINK_EVIDENCE_API_ADDR=127.0.0.1:8780 \
            LINK_EVIDENCE_FIXTURE_DIR="$GITHUB_WORKSPACE/packages/testing/fixtures" \
            /tmp/link-evidence-api >/tmp/link-evidence-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            status=$?
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8780/healthz >/dev/null; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null || test "$attempt" -eq 30; then
              cat /tmp/link-evidence-api.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error \
            'http://127.0.0.1:8780/api/v1/library?view=recent' \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["jellyfin"] == {"configured": False, "mode": "disabled", "lastSyncedAt": None}'
