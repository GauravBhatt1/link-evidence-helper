name: Request correlation safety

on:
  pull_request:
    branches:
      - restructure/integration
    paths:
      - apps/api/internal/requestmeta/**
      - .github/workflows/request-correlation.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Format check
        run: test -z "$(gofmt -l internal/requestmeta)"
      - name: Unit tests
        run: go test -race ./internal/requestmeta
      - name: Vet
        run: go vet ./internal/requestmeta
      - name: Secret and production boundary regression
        run: |
          ! grep -RInE '8765|password|passwd|secret|token|authorization|cookie|postgres://|redis://' internal/requestmeta
