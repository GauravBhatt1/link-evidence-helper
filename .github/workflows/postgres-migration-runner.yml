name: PostgreSQL migration runner safety

on:
  pull_request:
    branches:
      - restructure/integration
    paths:
      - "apps/api/internal/storage/migrations/**"
      - ".github/workflows/postgres-migration-runner.yml"
  push:
    branches:
      - restructure/integration
    paths:
      - "apps/api/internal/storage/migrations/**"
      - ".github/workflows/postgres-migration-runner.yml"

permissions:
  contents: read

jobs:
  migration-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Check formatting
        run: |
          test -z "$(gofmt -l internal/storage/migrations)"
      - name: Run migration tests
        run: go test -race ./internal/storage/migrations
      - name: Vet migration package
        run: go vet ./internal/storage/migrations
      - name: Reject credential-shaped migration runner fields
        run: |
          if grep -RniE '(authorization|cookie|password|secret|token|request_body|headers)' internal/storage/migrations/runner*.go; then
            echo "credential-shaped field found in migration runner boundary"
            exit 1
          fi
